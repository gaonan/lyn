<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#18231c">
<title>康乃馨 7.0 · 访问统计</title>
<style>
  :root { color-scheme: dark; font: 16px/1.55 system-ui, sans-serif; background: #17231c; color: #f5eedc; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top left,#343725,#17231c 55%); }
  main { max-width: 680px; margin: auto; padding: max(32px,env(safe-area-inset-top)) 20px 36px; }
  header { border-bottom: 1px solid #b8975566; padding: 0 0 18px; }
  header p { margin: 0; color: #d9bd81; font-size: 13px; }
  h1 { margin: 6px 0 0; font: 600 34px/1.24 "Songti SC",serif; }
  h2 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
  section, form { margin-top: 20px; }
  .cards { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; margin: 0; }
  .cards div, .record { min-width: 0; padding: 11px 10px; border: 1px solid #c7a46e55; background: #f1e2b30a; border-radius: 6px; }
  .cards dt, .record span { color: #d8d0b8; font-size: 12px; }
  .cards dd { margin: 5px 0 0; color: #f1d6a2; font: 550 clamp(20px,6vw,34px)/1.1 ui-monospace,monospace; overflow-wrap: anywhere; }
  .record { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
  .record strong { font-family: ui-monospace,monospace; color: #f1d6a2; }
  .toolbar { margin: 15px 0 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #status { margin: 0; font-size: 12px; color: #c6ceb9; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .history-table { overflow-x: auto; }
  th, td { padding: 7px 3px; text-align: right; border-bottom: 1px solid #e8d6b222; white-space: nowrap; }
  th { color: #d5bc87; font-weight: 500; }
  th:first-child, td:first-child { text-align: left; }
  button, input { font: inherit; color: inherit; border: 1px solid #be9b6055; border-radius: 5px; }
  button { min-height: 38px; padding: 0 12px; background: #d9bd83; color: #25261b; }
  button:disabled { opacity: .68; }
  label { display: block; font-size: 13px; margin-bottom: 7px; }
  .key-row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; width: 100%; padding: 6px 9px; background: #101910; }
  .definition { color: #b9c1aa; font-size: 12px; }
  .section-heading { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 10px; }
  .section-heading h2 { margin: 0; }
  .period { display: flex; padding: 3px; gap: 3px; border: 1px solid #c7a46e55; border-radius: 7px; }
  .period button { min-height: 31px; padding: 0 9px; font-size: 12px; color: #d8d0b8; background: transparent; border-color: transparent; }
  .period button[aria-pressed="true"] { color: #29271c; background: #edd6a2; }
  .challenge-cards { display: grid; gap: 8px; }
  @media (min-width: 540px) { .challenge-cards { grid-template-columns: repeat(2,minmax(0,1fr)); } }
  .challenge-card { --accent: #efc49d; padding: 11px 12px; border: 1px solid #c7a46e55; border-radius: 6px; background: #f1e2b30a; }
  .challenge-card[data-challenge="heart"] { --accent: #e9a6a6; }
  .challenge-card[data-challenge="magazine"] { --accent: #f0cc87; }
  .challenge-card[data-challenge="role"] { --accent: #d4bce9; }
  .challenge-card[data-challenge="record"] { --accent: #b9d7a9; }
  .challenge-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .challenge-title h3 { margin: 0; font-size: 14px; }
  .challenge-rate { color: var(--accent); font-size: 12px; }
  .challenge-stages { display: grid; grid-template-columns: 3.5em minmax(0,1fr) minmax(4ch,max-content); gap: 7px 9px; align-items: center; font-size: 12px; }
  .challenge-count { text-align: right; font: 550 13px ui-monospace,monospace; }
  .chart-track { height: 8px; overflow: hidden; border-radius: 6px; background: #f1e2b318; }
  .chart-fill { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
  .start-bar { opacity: .50; }
  .view-tabs { display: flex; gap: 6px; margin-top: 14px; }
  .view-tabs button { background: transparent; color: #ebd9b5; }
  .view-tabs button[aria-pressed="true"] { background: #edd6a2; color: #29271c; }
  .messages-count { color: #d8d0b8; font-size: 12px; }
  #messages-table th, #messages-table td { padding: 10px 8px; text-align: left; vertical-align: top; }
  #messages-table th:first-child, #messages-table td:first-child { width: 9ch; }
  #messages-table td:first-child { font-family: ui-monospace, monospace; color: #f1d6a2; }
  #messages-table td:last-child { white-space: normal; overflow-wrap: anywhere; }
</style>
<main>
  <header><p>康乃馨 7.0</p><h1>访问统计</h1></header>
  <form id="access" hidden>
    <label for="key">统计访问密钥</label>
    <div class="key-row"><input type="password" id="key" required autocomplete="off"><button>打开</button></div>
  </form>
  <div class="toolbar"><p id="status" role="status">正在读取…</p><button id="refresh" type="button" hidden>刷新</button></div>
  <div class="view-tabs" id="data-views" role="group" aria-label="查看统计或留言" hidden>
    <button type="button" data-view="statistics" aria-controls="statistics" aria-pressed="true">访问统计</button>
    <button type="button" data-view="messages" aria-controls="messages" aria-pressed="false">全部留言</button>
  </div>
  <div id="statistics" hidden>
    <section aria-labelledby="today-title">
      <h2 id="today-title">今天</h2>
      <dl class="cards" id="today"><div><dt>去重访客</dt><dd>—</dd></div><div><dt>页面打开</dt><dd>—</dd></div><div><dt>进入花房</dt><dd>—</dd></div></dl>
    </section>
    <section aria-labelledby="total-title">
      <h2 id="total-title">上线统计以来</h2>
      <dl class="cards" id="total"><div><dt>去重访客</dt><dd>—</dd></div><div><dt>页面打开</dt><dd>—</dd></div><div><dt>进入花房</dt><dd>—</dd></div></dl>
    </section>
    <div class="record"><span>唱片最新发号</span><strong id="number">—</strong></div>
    <section aria-labelledby="funnel-title">
      <h2 id="funnel-title">游玩漏斗</h2>
      <table id="funnel"><thead><tr><th scope="col">新版本事件</th><th scope="col">今天</th><th scope="col">累计</th></tr></thead><tbody></tbody></table>
      <p class="definition">加载失败含启动报错和出现停滞提示后离开。首次收集按页面去重，恢复存档和测试通关不计。</p>
    </section>
    <section id="challenges" aria-labelledby="challenges-title" hidden>
      <div class="section-heading">
        <h2 id="challenges-title">挑战漏斗</h2>
        <div class="period" role="group" aria-label="挑战统计时段">
          <button type="button" data-period="total" aria-pressed="true">累计</button>
          <button type="button" data-period="today" aria-pressed="false">今日开始</button>
        </div>
      </div>
      <div class="challenge-cards" aria-live="polite"></div>
      <p class="definition">各挑战独立按浏览器和站点去重。完成率以该时段开始挑战的玩家为分母。统计从本版上线后开始。</p>
    </section>
    <section aria-labelledby="history-title">
      <h2 id="history-title">近 7 天</h2>
      <div class="history-table"><table id="history"><thead><tr><th scope="col">日期</th><th scope="col">访客</th><th scope="col">打开</th><th scope="col">进场</th><th scope="col">就绪</th><th scope="col">失败</th><th scope="col">首收集</th></tr></thead><tbody></tbody></table></div>
    </section>
    <p class="definition">访客按同一浏览器、同一站点去重。进场按点过「开始收集」的页面计数。日期以北京时间为准。</p>
  </div>
  <section id="messages" aria-labelledby="messages-title" hidden>
    <div class="section-heading">
      <h2 id="messages-title">全部留言</h2>
      <span class="messages-count" id="messages-count"></span>
    </div>
    <table id="messages-table"><thead><tr><th scope="col">唱片编号</th><th scope="col">留言</th></tr></thead><tbody></tbody></table>
  </section>
</main>
<template id="challenge-card">
  <article class="challenge-card">
    <div class="challenge-title"><h3></h3><span class="challenge-rate"></span></div>
    <div class="challenge-stages">
      <span class="start-label"></span><span class="chart-track" aria-hidden="true"><span class="chart-fill start-bar"></span></span><span class="challenge-count start-count"></span>
      <span class="complete-label"></span><span class="chart-track" aria-hidden="true"><span class="chart-fill complete-bar"></span></span><span class="challenge-count complete-count"></span>
    </div>
  </article>
</template>
<script>
  const $ = selector => document.querySelector(selector);
  const form = $('#access'), status = $('#status'), refresh = $('#refresh'), stats = $('#statistics');
  const viewTabs = $('#data-views'), messagePanel = $('#messages');
  const messageRows = $('#messages-table tbody'), messageCount = $('#messages-count');
  const viewButtons = [...viewTabs.querySelectorAll('button')];
  const format = new Intl.NumberFormat('zh-CN');
  const percent = new Intl.NumberFormat('zh-CN', { style: 'percent', maximumFractionDigits: 1 });
  const clock = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit' });
  let key = location.hash.slice(1);
  let view = 'statistics';
  let pending;
  let challengeStats = null;
  let challengePeriod = 'total';
  if (!key) {
    try { key = sessionStorage.getItem('carnation7-stats-key'); } catch {}
  }
  function unlock(message) {
    form.hidden = false;
    refresh.hidden = stats.hidden = viewTabs.hidden = messagePanel.hidden = true;
    messageRows.replaceChildren();
    messageCount.textContent = '';
    status.textContent = message;
  }
  function values({ visitors, opens, enters }) {
    return [visitors, opens, enters].map(value => format.format(value));
  }
  const milestones = [
    ['页面打开', 'tracked'], ['加载完成', 'ready'], ['加载失败', 'failed'],
    ['进入花房', 'tracked_enters'], ['首次收集', 'first_collection'],
  ];
  function milestoneCount(data, name) {
    return data.tracked ? format.format(data[name]) : '—';
  }
  const challengeLabels = [
    ['heart', '心心', '首颗', '集齐'], ['magazine', '杂志', '首本', '集齐'],
    ['role', '影视角色', '首个', '集齐'], ['record', '唱片', '解锁', '领取'],
  ];
  function renderChallenges() {
    $('#challenges').hidden = !challengeStats;
    if (!challengeStats) return;
    const today = challengePeriod === 'today';
    const cards = challengeLabels.map(([name, title, startLabel, completeLabel]) => {
      const card = $('#challenge-card').content.firstElementChild.cloneNode(true);
      const data = challengeStats[name];
      const started = (today ? data?.today_started : data?.started) ?? 0;
      const completed = (today ? data?.today_completed : data?.completed) ?? 0;
      const rate = started > 0 ? completed / started : 0;
      card.dataset.challenge = name;
      card.querySelector('h3').textContent = title;
      card.querySelector('.start-label').textContent = startLabel;
      card.querySelector('.complete-label').textContent = completeLabel;
      card.querySelector('.start-count').textContent = format.format(started);
      card.querySelector('.complete-count').textContent = format.format(completed);
      card.querySelector('.challenge-rate').textContent = started ? `${percent.format(rate)} 完成` : '暂无开始记录';
      card.querySelector('.start-bar').style.width = started ? '100%' : '0';
      card.querySelector('.complete-bar').style.width = `${rate * 100}%`;
      return card;
    });
    $('.challenge-cards').replaceChildren(...cards);
  }
  const periodButtons = [...document.querySelectorAll('[data-period]')];
  for (const button of periodButtons) button.onclick = () => {
    challengePeriod = button.dataset.period;
    for (const choice of periodButtons) choice.setAttribute('aria-pressed', String(choice === button));
    renderChallenges();
  };
  function renderStatistics({ total, days, challenges }) {
    challengeStats = challenges;
    renderChallenges();
    const fill = (selector, data) => document.querySelectorAll(selector + ' dd')
      .forEach((cell, index) => { cell.textContent = values(data)[index]; });
    const today = days.at(-1);
    fill('#today', today);
    fill('#total', total);
    $('#funnel tbody').replaceChildren(...milestones.map(([label, name]) => {
      const row = document.createElement('tr');
      row.insertCell().textContent = label;
      row.insertCell().textContent = format.format(today[name] ?? 0);
      row.insertCell().textContent = format.format(total[name] ?? 0);
      return row;
    }));
    $('#history tbody').replaceChildren(...[...days].reverse().map(day => {
      const row = document.createElement('tr');
      [day.day.slice(5), ...values(day), ...['ready', 'failed', 'first_collection'].map(name => milestoneCount(day, name))]
        .forEach(value => { row.insertCell().textContent = value; });
      return row;
    }));
    fetch('/api/record-number', { cache: 'no-store' }).then(result => result.json()).then(({ latest }) => {
      $('#number').textContent = Number.isSafeInteger(latest) ? 'No.' + String(latest).padStart(6, '0') : '尚未发号';
    }).catch(() => { $('#number').textContent = '暂时无法查询'; });
  }
  function renderMessages({ messages }) {
    messageRows.replaceChildren(...messages.map(({ number, text }) => {
      const row = document.createElement('tr');
      row.insertCell().textContent = 'No.' + String(number).padStart(6, '0');
      row.insertCell().textContent = text;
      return row;
    }));
    messageCount.textContent = messages.length ? `共 ${format.format(messages.length)} 条` : '还没有公开留言';
  }
  function showView() {
    stats.hidden = view !== 'statistics';
    messagePanel.hidden = view !== 'messages';
    for (const button of viewButtons) button.setAttribute('aria-pressed', String(view === button.dataset.view));
  }
  for (const button of viewButtons) button.onclick = () => {
    if (view === button.dataset.view) return;
    view = button.dataset.view;
    showView();
    load();
  };
  async function load() {
    pending?.abort();
    pending = undefined;
    if (!/^[a-f0-9]{64}$/.test(key)) return unlock('请输入密钥，或打开你的私密统计链接。');
    const controller = new AbortController();
    pending = controller;
    const messages = view === 'messages';
    status.textContent = messages ? '正在读取留言…' : '正在读取…';
    refresh.hidden = false;
    refresh.disabled = true;
    try {
      const endpoint = messages ? '/api/visitor-stats?view=messages' : '/api/visitor-stats';
      const response = await fetch(endpoint, {
        headers: { Authorization: 'Bearer ' + key },
        cache: 'no-store',
        signal: controller.signal,
      });
      if (pending !== controller) return;
      if (response.status === 401) return unlock('统计密钥无效，请检查后重试。');
      if (!response.ok) throw new Error('Dashboard data unavailable');
      const data = await response.json();
      if (pending !== controller) return;
      if (messages) renderMessages(data);
      else renderStatistics(data);
      try { sessionStorage.setItem('carnation7-stats-key', key); } catch {}
      form.hidden = true;
      viewTabs.hidden = false;
      showView();
      status.textContent = '更新于 ' + clock.format(new Date()) + '（北京时间）';
    } catch {
      if (pending === controller) status.textContent = messages ? '暂时无法读取留言，请刷新重试。' : '暂时无法读取统计，请刷新重试。';
    } finally {
      if (pending === controller) {
        pending = undefined;
        refresh.disabled = false;
      }
    }
  }
  refresh.onclick = load;
  form.onsubmit = event => {
    event.preventDefault();
    key = $('#key').value.trim();
    load();
  };
  window.addEventListener('hashchange', () => {
    key = location.hash.slice(1);
    unlock('正在核对密钥…');
    load();
  });
  load();
</script>
</html>
