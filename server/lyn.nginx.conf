# Included at http scope. Versioned public assets are shared by every visitor;
# API responses and the private statistics page must never enter a shared cache.
map $arg_v $carnation_asset_cache {
    default "public, max-age=3600";
    "~^[0-9]{8}-r[0-9]+$" "public, max-age=31536000, immutable";
}
server {
    listen 127.0.0.1:8081;
    server_name lyn.lipopo.org;
    root /opt/yucai-stage/backend/public/flower;
    index index.html;
    client_max_body_size 1m;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json webmanifest;
        image/svg+xml svg;
        image/webp webp;
        image/png png;
        image/jpeg jpg;
        font/woff2 woff2;
        audio/mp4 m4a;
        text/plain txt;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    location ~ /\. { return 404; }
    include /opt/flower-cafe/record-number/record-number.nginx.conf;
    location ^~ /stats/ {
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /release.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.(?:js|mjs|css|woff2|webp|png|jpe?g|svg|ico|m4a|bin)$ {
        limit_except GET { deny all; }
        add_header Cache-Control $carnation_asset_cache;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=300, stale-if-error=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
