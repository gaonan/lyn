location ~ ^/api/(record-number|visit|visitor-stats)$ {
    client_max_body_size 128;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_pass http://127.0.0.1:8713;
}
location = /api/wall-messages {
    client_max_body_size 1200;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_pass http://127.0.0.1:8713;
}
